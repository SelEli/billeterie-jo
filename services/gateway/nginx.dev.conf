events {}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    proxy_connect_timeout   5s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # Health checks
        location = / { 
            access_log off; 
            return 200 'Health check (prod): OK'; 
            add_header Content-Type text/plain; 
        }
        location = /health { 
            access_log off; 
            return 200 'Health check: OK'; 
            add_header Content-Type text/plain; 
        }

        # CORS pour dev
        add_header 'Access-Control-Allow-Origin' '*'; 
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS'; 
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type'; 
        if ($request_method = OPTIONS) {
            return 204;
        }

        # === Auth service ===
        location ^~ /auth { 
            proxy_pass http://auth:3001/auth/; 
            error_page 502 503 504 = @service_offline; 
        }
        location ^~ /user { 
            proxy_pass http://auth:3001/user/; 
            error_page 502 503 504 = @service_offline; 
        }
        location ^~ /role { 
            proxy_pass http://auth:3001/role/; 
            error_page 502 503 504 = @service_offline; 
        }

        # === Ticketing service ===
        location ^~ /ticket { 
            proxy_pass http://ticketing:3002/ticket/; 
            error_page 502 503 504 = @service_offline; 
        }

        # === Payment service ===
        location ^~ /payment { 
            proxy_pass http://payment:3003/payment/; 
            error_page 502 503 504 = @service_offline; 
        }

        # === Verification service (désactivé) ===
        # location ^~ /verification { 
        #     proxy_pass http://verification:3004/verification/; 
        #     error_page 502 503 504 = @service_offline; 
        # }

        # Sécurité
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Fallback si service offline
        location @service_offline {
            return 200 '{"status":"offline","error":"Service non disponible"}';
            add_header Content-Type application/json;
        }
    }
}
