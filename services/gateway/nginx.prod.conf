worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logs vers stdout/stderr pour Docker
    access_log /dev/stdout;
    error_log /dev/stderr info;

    resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    proxy_connect_timeout   10s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # Health checks
        location = / { 
            access_log off; 
            return 200 'Health check (prod): OK'; 
            add_header Content-Type text/plain; 
        }
        location = /health { 
            access_log off; 
            return 200 'Health check: OK'; 
            add_header Content-Type text/plain; 
        }

        # === Interception globale des préflights OPTIONS ===
        location ~* ^/ {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' 'https://frontend-production-a1c6.up.railway.app' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
                return 204;
            }
        }

        # CORS global pour toutes les réponses générées par Nginx
        add_header 'Access-Control-Allow-Origin' 'https://frontend-production-a1c6.up.railway.app' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # === Test direct vers Auth (HTTPS externe) ===
        location = /test-auth {
            proxy_pass http://auth.railway.internal:3001/health;

            # SSL externe
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;

            # Host et version HTTP
            proxy_set_header Host auth-production-89f5.up.railway.app;
            proxy_http_version 1.1;

            # Forwarding headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Logs spécifiques pour debug
            access_log /dev/stdout;
            error_log /dev/stderr info;
        }


        # === Auth service ===
        location ^~ /auth {
            proxy_pass http://auth.railway.internal:3001/auth/;
            error_page 502 503 504 = @service_offline;
        }

        location ^~ /user {
            proxy_pass http://auth.railway.internal:3001/user/;
            error_page 502 503 504 = @service_offline;
        }

        location ^~ /role {
            proxy_pass http://auth.railway.internal:3001/role/;
            error_page 502 503 504 = @service_offline;
        }

        # === Ticketing service ===
        location ^~ /ticket {
            proxy_pass http://ticketing.railway.internal:3002/ticket/;
            error_page 502 503 504 = @service_offline;
        }

        # === Payment service ===
        location ^~ /payment {
            proxy_pass http://payment.railway.internal:3003/payment/;
            error_page 502 503 504 = @service_offline;
        }

        # === Verification service ===
        location ^~ /verification {
            proxy_pass http://verification.railway.internal:3004/verification/;
            error_page 502 503 504 = @service_offline;
        }

        # Sécurité
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Fallback si service offline
        location @service_offline {
            return 200 '{"status":"offline","error":"Service non disponible"}';
            add_header Content-Type application/json;
        }
    }
}
