#
# README : UN-COMMENT ROUTES ! 
#
events {}

http {
    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Compression Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    # DNS Docker – évite le "host not found" au démarrage si service absent
    resolver 127.0.0.11 valid=10s;

    # Timeout & buffers
    proxy_connect_timeout   5s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    proxy_buffer_size       16k;
    proxy_buffers           4 32k;
    proxy_busy_buffers_size 64k;

    # 📌 En‑têtes proxy communs pour toutes les proxifications
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # Racine → health par défaut
        location = / {
            access_log off;
            return 200 'Health check (default) : OK';
            add_header Content-Type text/plain;
        }

        location = /health {
            access_log off;
            return 200 'Health check : OK';
            add_header Content-Type text/plain;
        }

        # === Routes API ===
        location /auth/ {
            proxy_pass http://auth:3001/auth/;
            error_page 502 503 504 = @service_offline;
        }

        #/*location /ticketing/ {
        #    proxy_pass http://ticketing:3002/ticketing/;
        #    error_page 502 503 504 = @service_offline;
        #}

        #location /payment/ {
        #    proxy_pass http://payment:3003/payment/;
        #   error_page 502 503 504 = @service_offline;
        #}

        #location /verification/ {
        #    proxy_pass http://verification:3004/verification/;
        #    error_page 502 503 504 = @service_offline;
        #}

        # Sécurité basique
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Callback global si service absent
        location @service_offline {
            return 200 '{"status":"offline","error":"Service non disponible"}';
            add_header Content-Type application/json;
        }
    }
}
