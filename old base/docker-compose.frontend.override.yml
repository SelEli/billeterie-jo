services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: ./frontend/.env.development       # env spécifique dev
    ports:
      - "8080:5173"                              # port du dev server Vite/React
    volumes:
      - ./frontend:/app/frontend                 # monte uniquement le code source du frontend
      - frontend_node_modules:/app/frontend/node_modules  # conserve les deps compilées
      - ./shared:/app/shared                     # si le front utilise le dossier shared
    command: npm run dev                         # lance le serveur de dev avec hot-reload
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  frontend_node_modules:
