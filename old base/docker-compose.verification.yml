services:
  verification:
    build:
      context: .
      dockerfile: services/verification/Dockerfile
    env_file: ./services/verification/.env.production
    ports:
      - "3004:3004"
    depends_on:
      verification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - /app/services/verification/node_modules   # ← protège les deps buildées

volumes:
  verification_node_modules: {}
