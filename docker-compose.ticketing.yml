services:
  ticketing:
    build:
      context: .
      dockerfile: services/ticketing/Dockerfile
    env_file: ./services/ticketing/.env.production
    ports:
      - "3002:3002"
    depends_on:
      ticketing-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
