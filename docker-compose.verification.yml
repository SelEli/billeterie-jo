networks:
  jo-net:
    external: true

services:
  verification:
    build:
      context: .
      dockerfile: services/verification/Dockerfile
    env_file: ./services/verification/.env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@verification-db:5432/verification
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    networks: [jo-net]
