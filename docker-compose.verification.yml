services:
  ticketing:
    build: ./services/ticketing
    env_file: ./services/ticketing/.env
    ports:
      - "3002:3002"
    depends_on:
      ticketing-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
