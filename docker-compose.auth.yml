networks:
  jo-net:
    external: true

services:
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    env_file: ./services/auth/.env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/auth
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    networks: [jo-net]
