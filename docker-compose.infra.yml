services:
  zookeeper:
    image: confluentinc/cp-zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - jo-net

  kafka:
    image: confluentinc/cp-kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - jo-net

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - jo-net

  auth-db:
    image: postgres
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - jo-net

  ticketing-db:
    image: postgres
    container_name: ticketing-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing
    volumes:
      - ticketing-db-data:/var/lib/postgresql/data
    networks:
      - jo-net

  payment-db:
    image: postgres
    container_name: payment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - jo-net

  verification-db:
    image: postgres
    container_name: verification-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verification
    volumes:
      - verification-db-data:/var/lib/postgresql/data
    networks:
      - jo-net

  verification:
    build: ./services/verification
    container_name: verification
    env_file: ./services/verification/.env
    ports:
      - "3004:3004"
    depends_on:
      - kafka
      - redis
      - verification-db
    networks:
      - jo-net

volumes:
  auth-db-data:
  ticketing-db-data:
  payment-db-data:
  verification-db-data:

networks:
  jo-net:
    name: jo-net
    driver: bridge
