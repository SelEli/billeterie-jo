server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check frontend
    location = /health {
        access_log off;
        return 200 'Frontend Health: OK';
        add_header Content-Type text/plain;
    }

    # SPA routing
    location / {
        try_files $uri /index.html;
    }

    # Cache statique
    location ~* \.(?:css|js|gif|jpe?g|png|webp|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Sécurité globale
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # CORS global
    set $cors_origin "https://frontend-production-a1c6.up.railway.app";
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Fonction pour répondre aux préflight OPTIONS
    location ~* ^/(auth|user|role|ticket|payment|verification) {
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Test de santé backend Auth
    location = /test-auth {
        proxy_pass https://auth-production-89f5.up.railway.app/health;
        proxy_ssl_server_name on;
        proxy_set_header Host auth-production-89f5.up.railway.app;
        proxy_http_version 1.1;
        access_log off;
    }

    # === Proxies vers services publics Railway ===
    location ^~ /auth {
        proxy_pass https://auth-production-89f5.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host auth-production-89f5.up.railway.app;
        proxy_http_version 1.1;
    }

    location ^~ /user {
        proxy_pass https://auth-production-89f5.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host auth-production-89f5.up.railway.app;
        proxy_http_version 1.1;
    }

    location ^~ /role {
        proxy_pass https://auth-production-89f5.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host auth-production-89f5.up.railway.app;
        proxy_http_version 1.1;
    }

    location ^~ /ticket {
        proxy_pass https://ticketing-production-af26.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host ticketing-production-af26.up.railway.app;
        proxy_http_version 1.1;
    }

    location ^~ /payment {
        proxy_pass https://payment-production-8baf.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host payment-production-8baf.up.railway.app;
        proxy_http_version 1.1;
    }

    location ^~ /verification {
        proxy_pass https://verification-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host verification-production.up.railway.app;
        proxy_http_version 1.1;
    }

}
