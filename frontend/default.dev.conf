server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirection racine vers /app/
    location = / {
        return 301 /app/;
    }

    # Proxy API (optionnel)
    location ~ ^/(api|auth|payment|ticket|verification) {
        proxy_pass http://localhost:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forcer le slash final sur /app
    location = /app {
        return 301 /app/;
    }
    # Forcer aussi si quelqu’un tape /app sans slash avec query string
    rewrite ^/app$ /app/ permanent;

    # SPA routing sous /app
    location /app/ {
        try_files $uri /app/index.html;
    }

    # Cache statique sous /app
    location ~* ^/app/.*\.(?:css|js|gif|jpe?g|png|webp|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Sécurité basique
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
