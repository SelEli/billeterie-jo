server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Routes de ton appli front (SPA)
    location / {
        try_files $uri /index.html;
    }

    # Tout ce qui commence par /api, /auth, /payment, etc. ira au gateway
    location / {
        # par défaut, tout est servi en statique… SAUF si ça commence par un préfixe API
        try_files $uri @api;
    }

    location @api {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache long pour les assets statiques
    location ~* \.(?:css|js|gif|jpe?g|png|webp|ico|svg)$ {
        expires 30d;
        access_log off;
    }

    # Sécurité basique
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
