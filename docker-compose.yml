services:
  gateway:
    build: ./services/gateway
    ports:
      - "3000:3000"
    depends_on:
      - auth
      - ticketing
      - paiement
      - verification
    environment:
      - PORT=3000
    networks:
      - jo-net

  auth:
    build: ./services/auth
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@auth-db:5432/auth
      - JWT_SECRET=secret_key
    depends_on:
      - auth-db
    networks:
      - jo-net

  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - jo-net

  ticketing:
    build: ./services/ticketing
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@ticket-db:5432/ticketing
    depends_on:
      - ticket-db
    networks:
      - jo-net

  ticket-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    networks:
      - jo-net

  paiement:
    build: ./services/paiement
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - STRIPE_SECRET_KEY=sk_test_xxx
      - FRONT_URL=http://localhost:5173
      - DATABASE_URL=postgresql://postgres:postgres@paiement-db:5432/paiement
    depends_on:
      - paiement-db
    networks:
      - jo-net

  paiement-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paiement
    volumes:
      - paiement-db-data:/var/lib/postgresql/data
    networks:
      - jo-net

  verification:
    build: ./services/verification
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@verification-db:5432/verification
    depends_on:
      - verification-db
    networks:
      - jo-net

  verification-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verification
    volumes:
      - verification-db-data:/var/lib/postgresql/data
    networks:
      - jo-net

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - jo-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - jo-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - jo-net

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - jo-net

volumes:
  auth-db-data:
  ticket-db-data:
  paiement-db-data:
  verification-db-data:

networks:
  jo-net:
    driver: bridge
