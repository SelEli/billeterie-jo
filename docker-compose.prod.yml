
networks:
  bjo-network:
    driver: bridge

volumes:
  postgres_auth_data:
  postgres_ticketing_data:

services:
  # === Bases de données ===
  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - "54321:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - bjo-network

  ticketing-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing
    ports:
      - "54322:5432"
    volumes:
      - postgres_ticketing_data:/var/lib/postgresql/data
    networks:
      - bjo-network

  # === Redis ===
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - bjo-network

  # === Kafka & Zookeeper ===
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - bjo-network

  kafka:
    image: bitnami/kafka:3.6
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    networks:
      - bjo-network

  # === Micro-services ===
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./services/auth/.env.production
    depends_on:
      - auth-db
      - redis
      - kafka
    volumes:
      - ./services/auth:/app
      - /app/node_modules
    command: npm run start
    networks:
      - bjo-network

  ticketing:
    build:
      context: ./services/ticketing
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./services/ticketing/.env.production
    depends_on:
      - ticketing-db
      - redis
      - kafka
    volumes:
      - ./services/ticketing:/app
      - /app/node_modules
    command: npm run start
    networks:
      - bjo-network

  payment:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - ./services/payment/.env.production
    depends_on:
      - redis
      - kafka
    volumes:
      - ./services/payment:/app
      - /app/node_modules
    command: npm run start
    networks:
      - bjo-network

#  verification:
#    build:
#      context: ./services/verification
#      dockerfile: Dockerfile
#    ports:
#      - "3004:3004"
#    env_file:
#      - ./services/verification/.env.production
#    depends_on:
#      - redis
#      - kafka
#    volumes:
#      - ./services/verification:/app
#      - /app/node_modules
#    command: npm run start
#    networks:
#      - bjo-network

  # === Frontend ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env.production
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - bjo-network

  # === Gateway (NGINX reverse proxy) ===
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    env_file:
      - ./services/gateway/.env.production
    depends_on:
      - auth
      - ticketing
      - payment
      - frontend
    volumes:
      - ./services/gateway:/app
    networks:
      - bjo-network
