
services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [jo-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ticketing-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing
    volumes:
      - ticketing-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  payment-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  verification-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verification
    volumes:
      - verification-db-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Gateway en dev → dépend seulement de Kafka & Redis
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: ./services/gateway/.env.development
    ports:
      - "3000:3000"
    volumes:
      - ./services/gateway:/app/services/gateway
      - gateway_node_modules:/app/services/gateway/node_modules
      - ./shared:/app/shared
    command: npm run dev
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Frontend en dev → aucune dépendance
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: ./frontend/.env.development
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
      - ./shared:/app/shared
    command: npm run dev
    networks: [jo-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  auth-db-data:
  ticketing-db-data:
  payment-db-data:
  verification-db-data:
  gateway_node_modules:
  frontend_node_modules:

networks:
  jo-net:
    driver: bridge
