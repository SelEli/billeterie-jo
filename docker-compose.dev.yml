
services:
  # === Bases de données ===
  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - "54321:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  ticketing-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing
    ports:
      - "54322:5432"
    volumes:
      - postgres_ticketing_data:/var/lib/postgresql/data

  # === Redis ===
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # === Kafka & Zookeeper ===
  kafka:
    image: bitnami/kafka:3.6
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  # === Micro-services ===
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./services/auth/.env.development
    environment:
      NODE_ENV: development
      SEED_ON_START: "true"
    depends_on:
      - auth-db
      - redis
      - kafka
    volumes:
      - ./services/auth:/app
      - /app/node_modules
    command: npm run dev

  ticketing:
    build:
      context: ./services/ticketing
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./services/ticketing/.env.development
    environment:
      NODE_ENV: development
      SEED_ON_START: "true"
    depends_on:
      - ticketing-db
      - redis
      - kafka
    volumes:
      - ./services/ticketing:/app
      - /app/node_modules
    command: npm run dev

  payment:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - ./services/payment/.env.development
    environment:
      NODE_ENV: development
      SEED_ON_START: "true"
    depends_on:
      - redis
      - kafka
    volumes:
      - ./services/payment:/app
      - /app/node_modules
    command: npm run dev

  verification:
    build:
      context: ./services/verification
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    env_file:
      - ./services/verification/.env.development
    environment:
      NODE_ENV: development
      SEED_ON_START: "true"
    depends_on:
      - redis
      - kafka
    volumes:
      - ./services/verification:/app
      - /app/node_modules
    command: npm run dev

  # === Frontend ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # === Gateway (NGINX reverse proxy) ===
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - auth
      - ticketing
      - payment
      - frontend
    volumes:
      - ./services/gateway:/app

volumes:
  postgres_auth_data:
  postgres_ticketing_data:
